<!doctype html><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* the site's own key: the home page's night (#07080B, its WebGL clear colour), its ink and its star dust */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden;
    background: #07080B;
    font-family: 'Inter', -apple-system, sans-serif;
    color: #EEF0F6;
    padding: 74px 80px;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  canvas { position: absolute; inset: 0; z-index: 0; }
  body > :not(canvas) { position: relative; z-index: 1; }
  .eyebrow { font-size: 20px; color: rgba(238,240,246,.55); line-height: 1; }
  .headline {
    font-size: 76px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05;
    margin-top: 92px;
  }
  .sub { font-size: 26px; color: rgba(238,240,246,.62); line-height: 1.35; max-width: 1000px; margin-top: 22px; }
  .pills { display: flex; gap: 14px; margin-top: 43px; }
  .pill {
    border: 1px solid rgba(238,240,246,.16); border-radius: 10px; background: rgba(14,16,21,.78);
    padding: 11px 18px; font-size: 19px; line-height: 1;
  }
  .foot {
    margin-top: auto; display: flex; justify-content: space-between;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 18px; color: rgba(238,240,246,.45); line-height: 1;
  }
</style>
<body>
  <canvas id="dust" width="1200" height="630"></canvas>
  <div class="eyebrow">Yurii Fokin · Lead Product Designer</div>
  <h1 class="headline">Leading product design.</h1>
  <p class="sub">Enterprise data platforms, iOS apps and the design systems under them.</p>
  <div class="pills">
    <span class="pill">Data Marketplace</span>
    <span class="pill">Rebalancer</span>
    <span class="pill">DobroDoc+</span>
    <span class="pill">dopas.dp.ua</span>
  </div>
  <div class="foot"><span>yuryury.com</span><span>Batumi, GE · open to EU/US remote</span></div>
  <script>
    // star dust as on the home page: faint, cool-white, seeded so every rebuild draws the same sky
    (function () {
      var c = document.getElementById('dust').getContext('2d'), s = 7;
      function r() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }
      for (var i = 0; i < 1500; i++) {
        var a = 0.06 + Math.pow(r(), 3) * 0.5, d = 0.6 + r() * 0.9;
        c.fillStyle = 'rgba(204,224,255,' + a.toFixed(3) + ')';
        c.beginPath(); c.arc(r() * 1200, r() * 630, d, 0, 6.2832); c.fill();
      }
    })();
  </script>
</body>
