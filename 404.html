    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; background: var(--bg); }
    body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; font-family: 'Inter', -apple-system, sans-serif; color: var(--fg); background: var(--bg); line-height: 1.6; }

    a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: 6px; }

    .nav div { display: flex; gap: 22px; align-items: center; }

    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 8vh var(--pad) 14vh; max-width: 980px; }
    .code { font: 500 12px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .06em; color: var(--muted); }
    h1 { margin-top: 18px; font-size: clamp(44px, 8vw, 104px); font-weight: 700; letter-spacing: -0.05em; line-height: .95; }
    p { margin-top: 22px; max-width: 520px; font-size: 18px; color: rgba(238,240,246,.78); }
    .go { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 36px; }
    .go a { padding: 11px 19px; border-radius: 999px; font-size: 15px; font-weight: 600; }
    .go a:first-child { background: var(--fg); color: var(--bg); }
    .go a + a { border: 1px solid rgba(238,240,246,.25); }
    footer { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 22px var(--pad); border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
    footer div { display: flex; gap: 18px; }
    @media (max-width: 560px) { .nav div a:not(.pill) { display: none; } }
  </style>
